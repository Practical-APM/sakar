<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" shape-rendering="crispEdges">
  <!-- Soft pixel shadow -->
  <rect x="28" y="108" width="104" height="6" fill="#000" opacity="0.4"/>
  <!-- Open book: left cover -->
  <path d="M14 30 L78 18 L78 100 L20 108 Z" fill="#3d2110" stroke="#111" stroke-width="3" stroke-linejoin="miter"/>
  <!-- Right cover -->
  <path d="M82 18 L146 30 L140 108 L82 100 Z" fill="#4a2812" stroke="#111" stroke-width="3" stroke-linejoin="miter"/>
  <!-- Left page -->
  <path d="M24 34 L76 24 L76 96 L26 102 Z" fill="#fff6e0" stroke="#111" stroke-width="2.5" stroke-linejoin="miter"/>
  <!-- Right page -->
  <path d="M84 24 L136 34 L134 102 L84 96 Z" fill="#fff1d4" stroke="#111" stroke-width="2.5" stroke-linejoin="miter"/>
  <!-- Spine gutter -->
  <rect x="76" y="24" width="8" height="72" fill="#111" opacity="0.28"/>
  <!-- Text lines left -->
  <g fill="#c9b07a">
    <rect x="32" y="44" width="36" height="3"/>
    <rect x="32" y="54" width="34" height="3"/>
    <rect x="32" y="64" width="36" height="3"/>
    <rect x="32" y="74" width="30" height="3"/>
  </g>
  <!-- Text lines right -->
  <g fill="#c9b07a">
    <rect x="92" y="44" width="36" height="3"/>
    <rect x="92" y="54" width="34" height="3"/>
    <rect x="92" y="64" width="34" height="3"/>
    <rect x="92" y="74" width="28" height="3"/>
  </g>
  <!-- Gold title plate -->
  <rect x="38" y="34" width="26" height="7" fill="#f7d51d" stroke="#111" stroke-width="1.5"/>
  <!-- Ribbon Bookmark -->
  <polygon points="120,20 120,46 114,40 108,46 108,20" fill="#e76e55" stroke="#111" stroke-width="2"/>
</svg>
